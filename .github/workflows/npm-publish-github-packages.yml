# .github/workflows/deploy.yml
name: Deploy React/Vite App to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ¡ATENCIÓN! Usamos 'working-directory' para entrar a la carpeta del proyecto
      - name: Install dependencies
        run: npm install
        working-directory: ./PAGINA WEB SIWOTTOUYA # Asegúrate que este nombre coincida EXACTO

      - name: Build project (npm run build)
        run: npm run build
        working-directory: ./PAGINA WEB SIWOTTOUYA # Ejecutar la compilación aquí

      # Sube los artefactos. La carpeta 'dist' ahora está dentro de la subcarpeta.
      - name: Upload production assets
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./PAGINA WEB SIWOTTOUYA/dist # Ruta corregida al output de Vite

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
