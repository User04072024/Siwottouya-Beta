jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # CORREGIDO: Eliminamos el punto y la barra inicial './'
      - name: Install dependencies
        run: npm install
        working-directory: PAGINA WEB SIWOTTOUYA # ¡CORREGIDO!

      - name: Build project (npm run build)
        run: npm run build
        working-directory: PAGINA WEB SIWOTTOUYA # ¡CORREGIDO!

      # CORREGIDO: La ruta al artefacto también debe ser relativa a la raíz
      - name: Upload production assets
        uses: actions/upload-pages-artifact@v3
        with:
          path: PAGINA WEB SIWOTTOUYA/dist # ¡CORREGIDO!

  # ... (código del job deploy)
